name: checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  checks:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    container:
      image: consensys/tuweni-build:1.3@sha256:1333a39ae41bd6bf752ff0c0fe99cd95d8874cd9cc55ce7efbb0b3c0e8007e82
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: gradle spotlessCheck checkNotice
        run: gradle spotlessCheck checkNotice
