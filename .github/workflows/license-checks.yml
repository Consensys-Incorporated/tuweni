name: license checks

on:
  push:
    paths:
      - 'dependency-versions.gradle'

permissions:
  contents: read

jobs:
  license-checks:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    container:
      image: consensys/tuweni-build:1.3
      options: --user root # the image defaults to gradle; Actions needs root for the workspace
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: gradle checkLicense
        run: gradle checkLicense
