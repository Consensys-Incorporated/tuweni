plugins {
  id 'me.champeau.jmh' version '0.7.3'
}

description = 'Classes and utilities for working with byte arrays.'

dependencies {
  implementation 'org.connid:framework'
  implementation 'org.connid:framework-internal'
  compileOnly 'com.google.code.findbugs:jsr305'
  compileOnly 'com.google.errorprone:error_prone_annotations'
  api 'io.vertx:vertx-core'

  testImplementation 'io.vertx:vertx-core'
  testImplementation 'org.junit.jupiter:junit-jupiter-api'
  testImplementation 'org.junit.jupiter:junit-jupiter-params'
  testImplementation 'org.mockito:mockito-junit-jupiter'

  testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
}

//////
// Micro-benchmarks (src/jmh). Run with `./gradlew :bytes:jmh`; narrow the selection with
// `-PjmhIncludes=<regex>`. Results are written to build/results/jmh/results.json.

jmh {
  jmhVersion = '1.37'
  benchmarkMode = ['avgt']
  timeUnit = 'ns'
  fork = 2
  warmupIterations = 3
  warmup = '1s'
  iterations = 5
  timeOnIteration = '1s'
  failOnError = true
  resultFormat = 'JSON'
  if (project.hasProperty('jmhIncludes')) {
    includes = [project.property('jmhIncludes')]
  }
}

// The JMH-generated sources are not held to the project's lint and error-prone settings.
tasks.named('jmhCompileGeneratedClasses', JavaCompile) {
  options.errorprone.enabled = false
  options.compilerArgs.remove('-Werror')
}
